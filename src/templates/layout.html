<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="The Christmas Tower">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="740">
<meta property="og:image:alt" content="The cover of The Christmas Tower: a round stone tower at night above shepherds keeping watch by a fire">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B1426">
<script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem('ct-theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}d.setAttribute('data-theme',t);d.className+=' js'})();</script>
<link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="{{fontsHref}}" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{fontsHref}}"></noscript>
<style>{{inlineCss}}</style>
<script src="{{base}}assets/site.js?v={{jsVersion}}" defer></script>
</head>
<body class="{{bodyClass}}"{{bodyData}}>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
<div class="topbar-inner">
<a class="site-title" href="{{base}}">The Christmas Tower</a>
<nav class="topnav" aria-label="Site">
<a href="{{base}}#plan">Reading plan</a>
<a href="{{base}}#voices">Two voices</a>
<a href="{{base}}read/for-the-adults/">For grown-ups</a>
</nav>
<button type="button" class="theme-toggle" aria-label="Switch to light theme">
<span class="when-dark">{{sunIcon}}<span>Light</span></span>
<span class="when-light">{{moonIcon}}<span>Dark</span></span>
</button>
</div>
</header>
<main id="main" tabindex="-1">
{{main}}
</main>
<footer class="site-footer">
<div class="footer-inner">
<p><span class="footer-author">Written by David Haines.</span> {{esvNotice}}</p>
<p class="footer-links"><a href="{{kdpUrl}}">The original edition on Amazon</a> <a href="{{base}}about/">About the book</a></p>
</div>
</footer>
</body>
</html>
